t the homologous ends, exposing the full 30</text><text x="386.0" y="218.0" class="pc_caption">bp overlap plus a short unique single-stranded</text><g data-molecule-id="fragment_a_chewed" data-topology="linear"><text x="384.0" y="240.0" class="pc_mol_label">A (chewed)</text><text x="620.6" y="271.5" class="pc_end_label" text-anchor="middle" dominant-baseline="middle">3&apos; 30nt</text><rect x="436.4" y="258.0" width="157.7" height="8" fill="#f2c94c" data-fill-pattern="solid"/><rect x="594.1" y="258.0" width="39.4" height="8" fill="#55a84f" data-fill-pattern="solid"/><rect x="436.4" y="269.0" width="141.9" height="8" fill="#f2c94c" data-fill-pattern="solid"/><path d="M 436.8 257.2 L 429.4 259.4 L 436.8 261.8 L 429.4 264.2 L 436.8 266.8 Z" fill="url(#pc_bg)"/><path d="M 436.8 268.2 L 429.4 270.4 L 436.8 272.8 L 429.4 275.2 L 436.8 277.8 Z" fill="url(#pc_bg)"/><circle cx="416.4" cy="264.0" r="1.5" fill="#88a3ad"/><circle cx="422.4" cy="266.6" r="1.5" fill="#88a3ad"/><circle cx="428.4" cy="269.2" r="1.5" fill="#88a3ad"/></g><g data-molecule-id="fragment_b_chewed" data-topology="linear"><text x="384.0" y="312.0" class="pc_mol_label">B (chewed)</text><text x="423.4" y="338.5" class="pc_end_label" text-anchor="middle" dominant-baseline="middle">3&apos; 30nt</text><rect x="465.6" y="330.0" width="141.9" height="8" fill="#2f80ed" data-fill-pattern="solid"/><rect x="410.4" y="341.0" width="39.4" height="8" fill="#55a84f" data-fill-pattern="solid"/><rect x="449.9" y="341.0" width="157.7" height="8" fill="#2f80ed" data-fill-pattern="solid"/><path d="M 607.2 329.2 L 614.6 331.4 L 607.2 333.8 L 614.6 336.2 L 607.2 338.8 Z" fill="url(#pc_bg)"/><path d="M 607.2 340.2 L 614.6 342.4 L 607.2 344.8 L 614.6 347.2 L 607.2 349.8 Z" fill="url(#pc_bg)"/><circle cx="627.6" cy="336.0" r="1.5" fill="#88a3ad"/><circle cx="621.6" cy="338.6" r="1.5" fill="#88a3ad"/><circle cx="615.6" cy="341.2" r="1.5" fill="#88a3ad"/></g><path d="M 680.0 289.0 L 694.0 289.0" class="pc_link"/><rect class="pc_box